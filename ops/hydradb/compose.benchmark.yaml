name: palimpsest-hydradb-benchmark

services:
  object-store:
    image: minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - ${PALIMPSEST_HYDRADB_ENV_FILE:-.env.benchmark}
    ports:
      - "127.0.0.1:29000:9000"
      - "127.0.0.1:29001:9001"
    volumes:
      - palimpsest-hydradb-benchmark-object-store-v1:/data
    # Raised from 768m/1cpu on 2026-08-30 (#23), then again to 6 CPUs. Measured,
    # not guessed: at 1 CPU an ingest of three concurrent users pinned this
    # container at 99.9 % of it and 722 of 768 MiB while HydraDB sat at 38 % and
    # 255 MiB; at 3 CPUs it pinned again at 301 % while HydraDB used 106 %. The
    # object store, not the engine, is the benchmark's bottleneck, and it is
    # structural: the engine hard-codes SlateDB's WAL flush interval at **1 ms**
    # with `await_durable_writes` (`GraphDurabilityConfig::default()`, no env
    # override), so a write-heavy ingest is a stream of tiny durable PUTs and
    # MinIO's fixed per-object cost is what the ingest actually waits on. The
    # engine's disk read cache is on (see the hydradb service), so a *warm* read
    # does not land here — a cold one does, and that is why a cold ask is
    # 11 s against a warm 68 ms.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 6
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  object-store-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    env_file:
      - ${PALIMPSEST_HYDRADB_ENV_FILE:-.env.benchmark}
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://object-store:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null;
        mc mb --ignore-existing local/palimpsest-benchmark-v1 >/dev/null
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    restart: "no"

  hydradb:
    # Build this exact local image with scripts/build-hydradb-runtime.ps1.
    # The preflight script rejects a different image id or source revision.
    image: palimpsest/hydradb:6a2fbb1
    pull_policy: never
    env_file:
      - ${PALIMPSEST_HYDRADB_ENV_FILE:-.env.benchmark}
    environment:
      CLOUD_PROVIDER: aws
      AWS_BUCKET_NAME: palimpsest-benchmark-v1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://object-store:9000
      AWS_ALLOW_HTTP: "true"
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-p0
      GRAPH_BOLT_NODE_ADDRESSES: node-p0=hydradb:7687
      GRAPH_ADVERTISED_BOLT_ADDR: hydradb:7687
      GRAPH_DATA_CACHE_DIR: /var/cache/slatedb/data
      GRAPH_DATA_CACHE_BYTES: "536870912"
      # **Chosen per phase**: `false` while ingesting, `true` while evaluating.
      # `PALIMPSEST_HYDRADB_READ_CACHE=false docker compose up -d hydradb` before
      # a bulk ingest; unset it before an eval. This is a runtime setting, not
      # graph state — it changes how a read is served, never what is stored —
      # and `runtime_config_sha256` records which phase a result came from.
      #
      # Read side: the P0 profile disabled this cache, calling it "only an
      # optimization" and citing missing drop/depth telemetry. Both halves were
      # retested on 2026-08-30. The telemetry exists in this build —
      # `graph_object_store_cache_event_queue_depth` and
      # `graph_object_store_cache_events_dropped_total` are on /metrics, and both
      # are recorded with the result — and it is not an optimization: with the
      # cache off, the **first** convergence walk on a 20-user graph did not
      # finish inside a 25 s ceiling, because every block it reads is an HTTP
      # GET to MinIO. Warm it was 125 ms; with the cache, 68 ms.
      #
      # Write side: SlateDB caches on *put* as well as on get, so during an
      # ingest — a stream of tiny durable objects at a 1 ms flush interval — the
      # cache's in-memory bookkeeping grows with the object count rather than
      # with the graph. Enabled, RSS went from 1.79 GiB to 2.74 GiB in two
      # minutes of a six-user ingest and the capacity gate stopped the node at
      # 91.8 % of 6 GiB; disabled, the same ingest peaked at 1.52 GiB.
      #
      # The durable S3-compatible store is the source of truth either way.
      GRAPH_OBJECT_STORE_CACHE_ENABLED: "${PALIMPSEST_HYDRADB_READ_CACHE:-true}"
      GRAPH_AUTH_TOKEN_FILE: /run/secrets/hydradb_auth_token
      GRAPH_ALLOW_PLAINTEXT: "true"
      # The engine's own default, restored from the 3000 ms floor (#23). 3000 is
      # the minimum `GRAPH_WRITER_LEASE_MS` the node will accept and suits the
      # restart matrix, where a short lease is the point. Under a three-user
      # ingest it is not enough headroom: MinIO drops pooled connections often
      # enough that lease renewal misses its window, and the node answers
      # `writer_unavailable` mid-user.
      GRAPH_WRITER_LEASE_MS: "30000"
      RUST_MIN_STACK: "33554432"
      # **Chosen per phase**, like the read cache above: the engine's own 30 s
      # default while evaluating, and longer while ingesting.
      # `PALIMPSEST_HYDRADB_QUERY_RUNTIME_MS=120000 docker compose up -d hydradb`
      # before a bulk ingest.
      #
      # The 30 s cap exists to stop a runaway *plan*. During an ingest there is
      # no runaway plan — the statements are the same handful of shapes every
      # time and the slowness is I/O: with the read cache off, a relationship
      # edge scan is an object-store round trip, and it started crossing 30 s at
      # four concurrent users. Failing there is far more expensive than waiting,
      # because the unit that is lost is the whole *user*: minutes of correct
      # writes, and on a cache miss real money, thrown away to save 10 seconds.
      # The eval runs at the shipped 30 s, so no latency claim is made against a
      # relaxed cap, and `runtime_config_sha256` records which phase produced a
      # given result.
      GRAPH_MAX_QUERY_RUNTIME_MS: "${PALIMPSEST_HYDRADB_QUERY_RUNTIME_MS:-30000}"
      # Memory profile, tier A (#23). Free: these bound allocator fragmentation
      # and hand pages back after a hydration, and none of them shrinks a cache
      # the read path depends on, so they cost no measurable latency. The engine
      # links glibc malloc (no jemalloc) and exposes its `low_memory()` storage
      # preset only as individual GRAPH_* knobs — those are tier B and are
      # applied only if the step-load curve in step-load-2026-08.md demands
      # them, because smaller matrix/row caches buy RAM with MSpaths
      # recompilation and object-store reads.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "67108864"
      GRAPH_TRIM_MEMORY_AFTER_HYDRATION: "true"
      # Storage buffers, raised from the engine defaults (#23) — the opposite
      # direction from the spec's tier B, and for a measured reason. At the
      # defaults (64 MiB unflushed, 16 MiB L0 SSTs, one flush at a time) an
      # ingest of four concurrent users produced 2.0 GB of objects for eight
      # users and then lost a whole batch of four to the engine's 30 s runtime
      # cap: `max_unflushed_bytes` is backpressure, and when the flush behind it
      # is an object-store round trip, every writer waits for it. Bigger buffers
      # and parallel flushes mean fewer, larger objects and less blocking. This
      # spends RAM the step-load curve says we have; tier B would spend latency
      # we do not.
      GRAPH_MAX_UNFLUSHED_BYTES: "268435456"
      GRAPH_L0_SST_SIZE_BYTES: "67108864"
      GRAPH_L0_FLUSH_PARALLELISM: "4"
      # Tier B is **not** applied. It was, briefly, when the capacity gate
      # stopped the node at 91.8 % of 6 GiB — but that trip was the read cache
      # caching on put during an ingest, not the matrix and row caches tier B
      # bounds, and with tier B in place RSS still climbed 1.79 -> 2.74 GiB in
      # two minutes. Fixing the cause instead cost nothing; tier B would have
      # cost `graphMs` for a symptom it does not treat.
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:27687:7687"
      - "127.0.0.1:28443:8443"
      - "127.0.0.1:29090:9090"
    secrets:
      - hydradb_auth_token
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4
    restart: on-failure:3
    # The reviewed runtime contains no HTTP client. This is a liveness check;
    # scripts/p0-hydradb-preflight.ps1 performs the authoritative /readyz check.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

secrets:
  hydradb_auth_token:
    file: ${PALIMPSEST_HYDRADB_AUTH_TOKEN_FILE:-./secrets/hydradb-auth-token}

volumes:
  palimpsest-hydradb-benchmark-object-store-v1:
    name: palimpsest-hydradb-benchmark-object-store-v1
